<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>校集 · 管理后台</title>
<link rel="stylesheet" href="./style.css?v=2">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-logo">校</div>
      <div>
        <h1>校集 · 管理后台</h1>
        <p>GDUT 校园互助平台</p>
      </div>
    </div>
    <label class="fld">
      <span>账号</span>
      <input id="username" value="admin" autocomplete="username">
    </label>
    <label class="fld">
      <span>密码</span>
      <input id="password" type="password" value="admin123" autocomplete="current-password">
    </label>
    <button id="loginBtn" class="btn btn-primary btn-block">登 录</button>
    <p class="login-tip">初始账号 admin / admin123，上线前必须修改</p>
    <p id="loginErr" class="login-err"></p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="layout" hidden>
  <aside class="side">
    <div class="side-brand"><span class="dot"></span>校集后台</div>
    <nav id="nav">
      <a data-page="dashboard" class="nav-item nav-on">数据概览</a>
      <a data-page="verify" class="nav-item">认证审核 <em id="badgeVerify" class="nav-badge"></em></a>
      <a data-page="post" class="nav-item">内容审核 <em id="badgePost" class="nav-badge"></em></a>
      <a data-page="user" class="nav-item">用户管理</a>
      <a class="nav-item nav-disabled">举报处理 <i>待做</i></a>
      <a class="nav-item nav-disabled">公告管理 <i>待做</i></a>
      <a class="nav-item nav-disabled">订单监管 <i>只读·待做</i></a>
      <a class="nav-item nav-disabled">聊天监管 <i>只读·待做</i></a>
    </nav>
    <div class="side-foot">
      <span id="whoami">admin</span>
      <button id="logoutBtn" class="btn btn-mini">退出</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h2 id="pageTitle">数据概览</h2>
      <button id="refreshBtn" class="btn btn-mini">刷新</button>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<!-- 通用弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h3 id="modalTitle">操作</h3>
    <p id="modalDesc" class="modal-desc"></p>
    <textarea id="modalInput" rows="3" placeholder="请填写原因（会展示给用户）"></textarea>
    <div class="modal-foot">
      <button id="modalCancel" class="btn">取消</button>
      <button id="modalOk" class="btn btn-primary">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./app.js?v=2"></script>
</body>
</html>
