<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>分类 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar">
    <span class="appbar-title">分类</span>
    <span class="appbar-spacer"></span>
    <a class="iconbtn iconbtn--right" href="publish.html" aria-label="发布">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </a>
  </header>

  <main class="app-main">
    <div class="section-title">全部业务线</div>
    <div id="bizlist"></div>

    <div class="section-title mt-4">热门二级分类</div>
    <div class="chips chips--wrap" id="hotchips"></div>
    <div style="height:var(--s6)"></div>
  </main>

  <nav id="tabbar"></nav>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();
  UI.tabbar('category');

  var counts = {};
  window.MOCK.posts.forEach(function (p) { counts[p.biz] = (counts[p.biz] || 0) + 1; });

  document.getElementById('bizlist').innerHTML = Object.keys(window.BIZ).map(function (k) {
    var b = window.BIZ[k];
    return '<a class="bizrow" href="list.html?biz=' + k + '">'
      + '<span class="bizrow-ico">' + UI.icon(b.icon) + '</span>'
      + '<span class="grow">'
      + '<span class="bizrow-title" style="display:block">' + b.label + '</span>'
      + '<span class="bizrow-desc" style="display:block">' + b.desc + '</span>'
      + '</span>'
      + '<span class="text-3">' + (counts[k] || 0) + '</span>'
      + UI.icon('i-chev', 'ic--sm')
      + '</a>';
  }).join('');

  var hot = [
    ['教材教辅', 'SECONDHAND'], ['数码电子', 'SECONDHAND'],
    ['代取快递', 'ERRAND'], ['打印代办', 'ERRAND'],
    ['PPT 美化', 'SKILL'], ['相机租赁', 'RENTAL']
  ];
  document.getElementById('hotchips').innerHTML = hot.map(function (h, i) {
    return '<a class="chip' + (i === 0 ? ' chip--on' : '') + '" href="list.html?biz=' + h[1] + '">' + h[0] + '</a>';
  }).join('');
})();
</script>
</body>
</html>
