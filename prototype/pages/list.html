<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>列表 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="iconbtn" href="javascript:history.back()" aria-label="返回">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="appbar-title" id="bizTitle">全部</span>
  </header>

  <div class="filterbar" id="filterbar">
    <span class="f f--on" data-sort="default">综合</span>
    <span class="f" data-sort="price-asc">价格 ↑</span>
    <span class="f" data-sort="price-desc">价格 ↓</span>
    <span class="filterbar-count" id="count"></span>
  </div>

  <main class="app-main">
    <div class="feed mt-3" id="feed"></div>
  </main>

</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();

  var params = new URLSearchParams(location.search);
  var biz = params.get('biz') || 'ALL';
  var kw = params.get('kw') || '';
  var sort = 'default';

  document.getElementById('bizTitle').textContent =
    biz === 'ALL' ? '全部' : (window.BIZ[biz] ? window.BIZ[biz].label : '列表');

  function list() {
    var arr = window.MOCK.posts.filter(function (p) {
      if (biz !== 'ALL' && p.biz !== biz) return false;
      if (kw && p.title.indexOf(kw) < 0 && p.desc.indexOf(kw) < 0) return false;
      return true;
    });
    if (sort === 'price-asc') arr.sort(function (a, b) { return (a.price == null ? 1e9 : a.price) - (b.price == null ? 1e9 : b.price); });
    if (sort === 'price-desc') arr.sort(function (a, b) { return (b.price == null ? -1 : b.price) - (a.price == null ? -1 : a.price); });
    return arr;
  }

  function paint() {
    var arr = list();
    document.getElementById('count').textContent = arr.length + ' 条';
    var host = document.getElementById('feed');
    if (!arr.length) {
      host.innerHTML = '<div class="empty">'
        + '<div class="empty-ico">' + UI.icon('i-inbox', 'ic--lg') + '</div>'
        + '<div class="empty-title">没有找到相关内容</div>'
        + '<div class="empty-desc">换个分类或关键词试试</div></div>';
      return;
    }
    host.innerHTML = arr.map(UI.card).join('');
  }

  document.getElementById('filterbar').addEventListener('click', function (e) {
    var f = e.target.closest('.f');
    if (!f) return;
    UI.$$('.f', this).forEach(function (x) { x.classList.remove('f--on'); });
    f.classList.add('f--on');
    sort = f.dataset.sort;
    paint();
  });

  paint();
})();
</script>
</body>
</html>
