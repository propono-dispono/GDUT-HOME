<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>订单详情 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="iconbtn" href="javascript:history.back()" aria-label="返回">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="appbar-title">订单详情</span>
    <span class="appbar-spacer"></span>
    <a class="text-3" href="#" data-toast="客服在下一批；纠纷请走「申请仲裁」">客服</a>
  </header>

  <main class="app-main">

    <section style="padding:var(--s5) var(--gutter);background:var(--surface)">
      <div style="font-size:var(--fs-20);font-weight:700" id="stText">待确认</div>
      <div style="margin-top:4px;font-size:var(--fs-12);color:var(--ink-3)" id="stDesc"></div>
    </section>

    <div class="section-title mt-3">内容</div>
    <a class="rowlink" id="postLink" href="#">
      <span class="media media--sm" id="thumb"></span>
      <span class="grow">
        <span style="display:block;font-size:var(--fs-14);font-weight:600" id="ptitle">—</span>
        <span style="display:block;font-size:var(--fs-11);color:var(--ink-3)" id="pmeta">—</span>
      </span>
      <span class="price price--sm" id="pamount">—</span>
    </a>

    <div class="section-title mt-3">进度</div>
    <div style="padding:var(--s3) var(--gutter) var(--s4);background:var(--surface)">
      <div class="timeline" id="timeline"></div>
    </div>

    <div class="section-title mt-3">订单信息</div>
    <div class="kvlist">
      <div class="kv"><span class="kv-k">订单号</span><span class="kv-v" id="ono">—</span></div>
      <div class="kv"><span class="kv-k">业务类型</span><span class="kv-v" id="obiz">—</span></div>
      <div class="kv"><span class="kv-k">结算方式</span><span class="kv-v">线下当面结算，平台不经手资金</span></div>
      <div class="kv"><span class="kv-k">对方</span><span class="kv-v" id="oother">—</span></div>
      <div class="kv"><span class="kv-k">创建时间</span><span class="kv-v" id="otime">—</span></div>
    </div>

    <div style="padding:var(--s4) var(--gutter)">
      <div class="notice">平台仅记录订单状态，不代收款项、不托管资金。请当面验货、当面结算。</div>
    </div>

    <div style="height:var(--s4)"></div>
  </main>

  <div class="actionbar" id="actions"></div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();

  var id = Number(new URLSearchParams(location.search).get('id')) || 9001;
  var o = window.MOCK.orders.filter(function (x) { return x.id === id; })[0] || window.MOCK.orders[0];
  var st = window.STATUS[o.status] || { text: o.status, cls: '' };
  var biz = window.BIZ[o.biz] || {};

  document.getElementById('stText').textContent = st.text;
  document.getElementById('ptitle').textContent = o.title;
  document.getElementById('pmeta').textContent = biz.label + ' · ' + o.no;
  document.getElementById('pamount').innerHTML = '<span class="cur">¥</span>' + o.amount;
  document.getElementById('ono').textContent = o.no;
  document.getElementById('obiz').textContent = biz.label;
  document.getElementById('oother').textContent = o.other;
  document.getElementById('otime').textContent = o.time;
  document.getElementById('thumb').innerHTML = '';

  /* 状态说明 + 可用操作（严格对应「状态 + 角色」） */
  var DESC = {
    CREATED:   '等待对方确认',
    CONFIRMED: '已确认，请按约定线下见面交易',
    DELIVERED: '对方已标记交付，请确认收货',
    COMPLETED: '交易已完成，可以评价对方',
    DISPUTE:   '已提交仲裁，等待平台处理'
  };
  var ACTIONS = {
    BUYER: {
      CREATED:   [['取消订单', 'btn--ghost'], ['提醒卖家', 'btn--primary']],
      CONFIRMED: [['申请仲裁', 'btn--ghost']],
      DELIVERED: [['申请仲裁', 'btn--ghost'], ['确认完成', 'btn--primary']],
      COMPLETED: [['去评价', 'btn--primary']],
      DISPUTE:   [['查看进度', 'btn--ghost']]
    },
    SELLER: {
      CREATED:   [['拒绝', 'btn--ghost'], ['确认接单', 'btn--primary']],
      CONFIRMED: [['标记已交付', 'btn--primary']],
      DELIVERED: [['等待买家确认', 'btn--ghost']],
      COMPLETED: [['去评价', 'btn--primary']],
      DISPUTE:   [['查看进度', 'btn--ghost']]
    }
  };

  document.getElementById('stDesc').textContent = DESC[o.status] || '';

  var acts = (ACTIONS[o.role] || {})[o.status] || [];
  document.getElementById('actions').innerHTML = acts.map(function (a) {
    return '<button class="btn ' + a[1] + '" onclick="UI.toast(\'' + a[0] + ' → PATCH /api/app/order/{id}/status\')">' + a[0] + '</button>';
  }).join('') + '<a class="btn btn--ghost btn--fixed" style="flex:0 0 34%" href="chat.html">私信</a>';

  /* 时间线 */
  var T = [
    ['CREATED', '买家下单'],
    ['CONFIRMED', '卖家确认'],
    ['DELIVERED', '卖家标记交付'],
    ['COMPLETED', '买家确认完成']
  ];
  var idx = 0;
  T.forEach(function (t, i) { if (t[0] === o.status) idx = i; });
  if (o.status === 'DISPUTE') idx = 2;

  document.getElementById('timeline').innerHTML = T.map(function (t, i) {
    var cls = i < idx ? 'tl-item--done' : (i === idx ? 'tl-item--current' : '');
    if (o.status === 'DISPUTE' && i === 3) cls = 'tl-item--danger';
    var time = i < idx ? o.time : (i === idx ? '进行中' : '待完成');
    return '<div class="tl-item ' + cls + '"><span class="tl-dot"></span>'
      + '<div class="tl-body"><div class="tl-name">' + t[1] + '</div>'
      + '<div class="tl-time">' + time + '</div></div></div>';
  }).join('');
})();
</script>
</body>
</html>
