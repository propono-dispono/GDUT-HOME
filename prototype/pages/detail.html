<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>详情 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="iconbtn" href="javascript:history.back()" aria-label="返回">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="appbar-title">详情</span>
    <span class="appbar-spacer"></span>
    <a class="iconbtn iconbtn--right" href="#" data-toast="举报入口：虚假信息 / 违规 / 诈骗" aria-label="更多">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
    </a>
  </header>

  <main class="app-main">

    <div id="hero"></div>

    <section style="padding:var(--s4) var(--gutter);background:var(--surface)">
      <div class="row gap-2">
        <span class="tag tag--solid" id="bizTag">二手</span>
        <span class="text-3" id="meta"></span>
      </div>
      <h1 style="margin-top:var(--s2);font-size:var(--fs-18);font-weight:700;line-height:1.4" id="title"></h1>
      <div style="margin-top:var(--s3)" id="priceRow"></div>
    </section>

    <div class="section-title mt-3" id="fieldsTitle">业务信息</div>
    <div class="kvlist" id="fields"></div>

    <div class="section-title mt-3">描述</div>
    <div style="padding:0 var(--gutter) var(--s4);background:var(--surface);font-size:var(--fs-14);color:var(--ink-2);line-height:var(--lh-loose)" id="desc"></div>

    <div class="section-title mt-3">发布人</div>
    <a class="rowlink" href="#" data-toast="他人主页：下一批接入">
      <span class="avatar" id="uavatar">林</span>
      <span class="grow">
        <span style="display:block;font-size:var(--fs-14);font-weight:600" id="uname">林同学</span>
        <span style="display:block;font-size:var(--fs-11);color:var(--ink-3)">已认证 · 信用分 82</span>
      </span>
      <svg class="ic ic--sm" style="color:var(--ink-4)" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </a>

    <div style="padding:var(--s4) var(--gutter)">
      <div class="notice" id="notice"></div>
    </div>

    <div style="height:var(--s4)"></div>
  </main>

  <div class="actionbar">
    <a class="btn btn--ghost" style="flex:0 0 38%" href="chat.html">私信</a>
    <button class="btn btn--primary" id="cta">我想要</button>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();

  var params = new URLSearchParams(location.search);
  var type = params.get('type') || 'SECONDHAND';
  var id = Number(params.get('id')) || 1;
  var biz = window.BIZ[type] || window.BIZ.SECONDHAND;

  var post = window.MOCK.posts.filter(function (p) { return p.biz === type && p.id === id; })[0]
          || window.MOCK.posts.filter(function (p) { return p.biz === type; })[0]
          || window.MOCK.posts[0];

  /* 大图 */
  document.getElementById('hero').innerHTML = UI.media(post.cover, 'media--wide');

  document.getElementById('bizTag').textContent = biz.label;
  document.getElementById('meta').textContent = post.meta;
  document.getElementById('title').textContent = post.title;
  document.getElementById('desc').textContent = post.desc;

  /* 价格 */
  if (post.price == null) {
    document.getElementById('priceRow').innerHTML = '<span class="price--none">无私聊即无交易，请通过私信联系</span>';
  } else {
    document.getElementById('priceRow').innerHTML =
      '<span class="price"><span class="cur">¥</span>' + post.price + '</span>'
      + (post.priceUnit ? ' <span class="text-3">/ ' + post.priceUnit + '</span>' : '');
  }

  /* 类型专属字段 */
  document.getElementById('fields').innerHTML = biz.fields.map(function (f) {
    return '<div class="kv"><span class="kv-k">' + f.k + '</span><span class="kv-v">' + f.v + '</span></div>';
  }).join('');

  document.getElementById('notice').textContent = biz.notice;
  document.getElementById('uavatar').textContent = post.user;
  document.getElementById('uname').textContent = post.user + '同学';
  document.getElementById('cta').textContent = biz.cta;

  document.getElementById('cta').addEventListener('click', function () {
    if (type === 'LOST') {
      UI.toast('已发起线索沟通，请通过私信联系');
      return;
    }
    location.href = 'order-detail.html?id=9001';
  });
})();
</script>
</body>
</html>
