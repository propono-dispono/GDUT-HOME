<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>我的 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar appbar--plain">
    <span class="appbar-title">我的</span>
    <span class="appbar-spacer"></span>
    <a class="iconbtn iconbtn--right" href="#" data-toast="设置页在下一批" aria-label="设置">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h7M15 17h5"/><circle cx="15" cy="7" r="1.8"/><circle cx="9" cy="12" r="1.8"/><circle cx="13" cy="17" r="1.8"/></svg>
    </a>
  </header>

  <main class="app-main">

    <!-- 个人信息 -->
    <section class="profile">
      <span class="avatar avatar--xl" id="avatar">林</span>
      <div class="grow">
        <div class="profile-name" id="uname">林同学</div>
        <div class="profile-sub row gap-2" style="flex-wrap:nowrap;overflow:hidden">
          <span class="tag tag--solid">已认证</span>
          <span id="usub" class="ellipsis">GDUT · 信用分 82</span>
        </div>
      </div>
      <a class="btn btn--ghost btn--sm" href="verify.html">校园认证</a>
    </section>

    <!-- 数据 -->
    <section class="section">
      <div class="stat-row">
        <div class="stat"><div class="stat-n" id="sPost">6</div><div class="stat-l">发布</div></div>
        <div class="stat"><div class="stat-n" id="sDeal">4</div><div class="stat-l">成交</div></div>
        <div class="stat"><div class="stat-n" id="sCredit">82</div><div class="stat-l">信用分</div></div>
      </div>
    </section>

    <!-- 订单 -->
    <section class="mt-3">
      <div class="row" style="padding:0 var(--gutter) var(--s2)">
        <span class="section-title" style="padding:0">我的订单</span>
        <a class="text-3" href="orders.html" style="margin-left:auto">全部 ›</a>
      </div>
      <div class="entrygrid" id="orderEntries"></div>
    </section>

    <!-- 功能 -->
    <section class="mt-3">
      <a class="rowlink" href="orders.html?role=BUYER">
        <span class="rowlink-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16l-1.5 12H5.5L4 7Z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg></span>
        <span class="rowlink-label">我买到的</span>
        <span class="rowlink-chev"><svg class="ic ic--sm" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </a>
      <a class="rowlink" href="orders.html?role=SELLER">
        <span class="rowlink-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M4 12h13l-3-3M4 12l3 3"/><path d="M20 5v14"/></svg></span>
        <span class="rowlink-label">我卖出的 / 我接的单</span>
        <span class="rowlink-chev"><svg class="ic ic--sm" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </a>
      <a class="rowlink" href="#" data-toast="我的发布：下一批接入">
        <span class="rowlink-ico"><svg class="ic" viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h5"/></svg></span>
        <span class="rowlink-label">我的发布</span>
        <span class="rowlink-chev"><svg class="ic ic--sm" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </a>
      <a class="rowlink" href="#" data-toast="我的收藏：下一批接入">
        <span class="rowlink-ico"><svg class="ic" viewBox="0 0 24 24"><path d="m12 4 2.4 5 5.6.8-4 3.9 1 5.5-5-2.6-5 2.6 1-5.5-4-3.9 5.6-.8L12 4Z"/></svg></span>
        <span class="rowlink-label">我的收藏</span>
        <span class="rowlink-chev"><svg class="ic ic--sm" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>
      </a>
    </section>


    <div class="text-3" style="text-align:center;padding:var(--s6) 0">校集 原型 v0.5 · 数据为演示数据</div>
  </main>

  <nav id="tabbar"></nav>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();
  UI.tabbar('mine');

  var me = window.MOCK.me;
  document.getElementById('avatar').textContent = me.initial;
  document.getElementById('uname').textContent = me.name;
  document.getElementById('usub').textContent = 'GDUT · 信用分 ' + me.credit;
  document.getElementById('sPost').textContent = me.posts;
  document.getElementById('sDeal').textContent = me.deals;
  document.getElementById('sCredit').textContent = me.credit;

  var states = [
    ['待确认', 'CREATED'], ['待交付', 'CONFIRMED'],
    ['待收货', 'DELIVERED'], ['已完成', 'COMPLETED']
  ];
  document.getElementById('orderEntries').innerHTML = states.map(function (s) {
    return '<a href="orders.html?status=' + s[1] + '">'
      + '<svg class="ic" viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h4"/></svg>'
      + '<span>' + s[0] + '</span></a>';
  }).join('');

})();
</script>
</body>
</html>
