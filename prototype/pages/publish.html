<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>发布 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar">
    <a class="iconbtn" href="javascript:history.back()" aria-label="返回">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <span class="appbar-title">发布</span>
    <span class="appbar-spacer"></span>
    <a class="text-3" href="#" data-toast="草稿已保存到本地（演示）">存草稿</a>
  </header>

  <main class="app-main">

    <div class="section-title">选择类型</div>
    <div class="chips chips--wrap" id="types"></div>

    <div id="form"></div>

    <div style="padding:var(--s4) var(--gutter)">
      <div class="notice notice--warn" id="notice"></div>
    </div>

    <div style="height:var(--s4)"></div>
  </main>

  <div class="actionbar">
    <button class="btn btn--primary btn--block" id="submit">提交审核</button>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();

  var params = new URLSearchParams(location.search);
  var cur = params.get('type') || 'SECONDHAND';
  if (!window.BIZ[cur]) cur = 'SECONDHAND';

  /* 类型选择 */
  var types = document.getElementById('types');
  types.innerHTML = Object.keys(window.BIZ).map(function (k) {
    var b = window.BIZ[k];
    return '<button class="chip' + (k === cur ? ' chip--on' : '') + '" data-type="' + k + '">'
      + b.short + '</button>';
  }).join('');

  function renderForm() {
    var b = window.BIZ[cur];
    var html = '';

    /* 通用字段 */
    html += '<div class="section-title mt-3">基本信息</div>';
    html += '<div class="field">'
      + '<div class="field-label">标题 <span class="req">*</span></div>'
      + '<input class="field-control" placeholder="一句话说清楚，最多 60 字" maxlength="60">'
      + '<div class="field-hint">请勿填写联系方式，平台内私信沟通</div></div>';

    html += '<div class="field">'
      + '<div class="field-label">描述 <span class="req">*</span></div>'
      + '<textarea class="field-control" placeholder="成色、规格、交易方式等"></textarea></div>';

    html += '<div class="field">'
      + '<div class="field-label">图片（最多 9 张）</div>'
      + '<div class="uploader">'
      + '<div class="uploader-slot">' + UI.icon('i-image', 'ic--sm') + '</div>'
      + '<div class="uploader-slot">' + UI.icon('i-plus', 'ic--sm') + '</div>'
      + '</div></div>';

    if (cur !== 'LOST') {
      html += '<div class="field">'
        + '<div class="field-label">' + b.priceLabel + '（元）</div>'
        + '<input class="field-control" placeholder="0.00" inputmode="decimal">'
        + '<div class="field-hint">仅作展示，线下当面结算，平台不经手资金</div></div>';
    }

    /* 类型专属字段：由注册表驱动，各 4 项 */
    html += '<div class="section-title mt-3">' + b.label + '信息</div>';
    html += '<div>' + b.fields.map(function (f) {
      return '<div class="field">'
        + '<div class="field-label">' + f.k + '</div>'
        + '<input class="field-control" placeholder="请填写' + f.k + '">'
        + '</div>';
    }).join('') + '</div>';

    html += '<div class="field">'
      + '<div class="field-label">楼栋位置</div>'
      + '<input class="field-control" placeholder="例如：3号楼 / 图书馆"></div>';

    html += '<div class="field">'
      + '<div class="field-label">标签</div>'
      + '<input class="field-control" placeholder="用逗号分隔，例如：教材, 考研"></div>';

    document.getElementById('form').innerHTML = html;
    document.getElementById('notice').textContent = b.notice;
  }

  types.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    UI.$$('.chip', types).forEach(function (x) { x.classList.remove('chip--on'); });
    b.classList.add('chip--on');
    cur = b.dataset.type;
    renderForm();
  });

  document.getElementById('submit').addEventListener('click', function () {
    UI.toast('已提交，进入审核队列（演示）');
  });

  renderForm();
})();
</script>
</body>
</html>
