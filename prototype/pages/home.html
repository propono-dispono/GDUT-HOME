<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>首页 · 校集</title>
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/components.css">
</head>
<body>
<div class="app">

  <header class="appbar appbar--plain">
    <span class="appbar-title">校集</span>
    <span class="appbar-sub">GDUT</span>
    <span class="appbar-spacer"></span>
    <a class="iconbtn iconbtn--right" href="messages.html" aria-label="消息">
      <svg class="ic" aria-hidden="true" viewBox="0 0 24 24"><path d="M18 16H6l1.5-2.5V10a4.5 4.5 0 0 1 9 0v3.5L18 16Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </a>
  </header>

  <main class="app-main">

    <div class="search">
      <span id="sIcon"></span>
      <input id="kw" type="search" placeholder="搜教材、鼠标、代取快递…" autocomplete="off">
    </div>

    <nav class="bizgrid" id="bizgrid" aria-label="业务分类"></nav>

    <div class="chips" id="chips">
      <button class="chip chip--on" data-biz="ALL">全部</button>
    </div>

    <div class="feed" id="feed"></div>

  </main>

  <nav id="tabbar"></nav>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
(function () {
  UI.shell();
  UI.tabbar('home');

  document.getElementById('sIcon').innerHTML = UI.icon('i-search');

  /* 六条业务线金刚区 */
  document.getElementById('bizgrid').innerHTML = Object.keys(window.BIZ).map(function (k) {
    var b = window.BIZ[k];
    return '<a class="bizitem" href="list.html?biz=' + k + '">'
      + UI.icon(b.icon) + '<span>' + b.short + '</span></a>';
  }).join('');

  /* 分类 chips */
  var chips = document.getElementById('chips');
  chips.innerHTML += Object.keys(window.BIZ).map(function (k) {
    return '<button class="chip" data-biz="' + k + '">' + window.BIZ[k].short + '</button>';
  }).join('');

  var curBiz = 'ALL';
  var kw = '';

  function paint() {
    UI.renderFeed(document.getElementById('feed'), { biz: curBiz, kw: kw });
  }

  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    UI.$$('.chip', chips).forEach(function (x) { x.classList.remove('chip--on'); });
    b.classList.add('chip--on');
    curBiz = b.dataset.biz;
    paint();
  });

  document.getElementById('kw').addEventListener('input', function (e) {
    kw = e.target.value;
    paint();
  });

  paint();
})();
</script>
</body>
</html>
