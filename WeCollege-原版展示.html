<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeCollege · 原版界面展示</title>
<style>
  :root{
    --bg:#eef1f6;--card:#fff;--ink:#1f2329;--ink2:#4e5969;--ink3:#86909c;
    --line:#dde1e8;--brand:#2f6bff;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }

  .toolbar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);
    position:relative;z-index:5;
  }
  .brand{font-size:14px;font-weight:700}
  .badge{
    font-size:11px;padding:2px 8px;border-radius:999px;
    background:#e8f7ee;color:#0b7a45;border:1px solid #bfe6cf;font-weight:500;
  }
  select{
    font:inherit;font-size:12.5px;color:var(--ink);
    padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;
    max-width:280px;
  }
  .navbtn{
    border:1px solid var(--line);background:#fff;color:var(--ink2);
    font:inherit;font-size:13px;width:30px;height:30px;border-radius:8px;cursor:pointer;
    display:grid;place-items:center;transition:.14s;
  }
  .navbtn:hover{border-color:#bcd0ff;color:var(--brand)}
  .counter{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:52px}
  .spacer{flex:1}
  .spec{font-size:11.5px;color:var(--ink3);background:#f4f6f9;border:1px solid var(--line);
        padding:2px 9px;border-radius:999px;font-variant-numeric:tabular-nums}

  .stage{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;
         padding:20px 0 0;overflow:auto}
  .wrap{position:relative}
  .frame{
    width:400px;background:#fff;overflow:hidden;
    box-shadow:0 16px 44px rgba(15,23,42,.16),0 0 0 1px rgba(15,23,42,.08);
    transform-origin:top left;
  }
  .frame img{display:block;width:400px;height:auto}

  .note{
    position:fixed;left:0;right:0;bottom:0;padding:7px 16px;
    background:rgba(255,255,255,.92);border-top:1px solid var(--line);
    font-size:11.5px;color:var(--ink3);text-align:center;
  }
  .note b{color:var(--ink2)}

  @media (max-width:720px){
    .brand,.spec,.badge{display:none}
    .toolbar{padding:8px 10px;gap:8px}
  }
</style>
</head>
<body>

<div class="toolbar">
  <span class="brand">WeCollege · 原版界面</span>
  <span class="badge">源码未改动</span>
  <select id="picker"></select>
  <button class="navbtn" id="prev" title="上一张">‹</button>
  <span class="counter" id="counter">1 / 18</span>
  <button class="navbtn" id="next" title="下一张">›</button>
  <span class="spacer"></span>
  <span class="spec" id="spec">—</span>
</div>

<div class="stage" id="stage">
  <div class="wrap" id="wrap">
    <div class="frame" id="frame">
      <img id="shot" alt="WeCollege 原版界面截图">
    </div>
  </div>
</div>

<div class="note">
  以下图片来自仓库 <b>demo/</b> 目录的<b>原始截图</b>，未做任何裁剪或修改 ｜ 按 400px 宽等比呈现 ｜ 可用 ← → 键切换
</div>

<script>
  const BASE = 'WeCollege/demo/';

  const PAGES = [
    { g: '用户端（小程序）', f: '1首页.png',        w: 460, h: 811,  n: '首页' },
    { g: '用户端（小程序）', f: '2表白墙.png',      w: 459, h: 816,  n: '表白墙' },
    { g: '用户端（小程序）', f: '3我要表白.png',    w: 472, h: 825,  n: '发布表白' },
    { g: '用户端（小程序）', f: '4失物招领.png',    w: 454, h: 792,  n: '失物招领' },
    { g: '用户端（小程序）', f: '5发布失物.png',    w: 457, h: 804,  n: '发布失物' },
    { g: '用户端（小程序）', f: '6兼职.png',        w: 453, h: 829,  n: '兼职招聘' },
    { g: '用户端（小程序）', f: '7发布兼职.png',    w: 453, h: 817,  n: '发布兼职' },
    { g: '用户端（小程序）', f: '8闲置.png',        w: 456, h: 810,  n: '二手闲置' },
    { g: '用户端（小程序）', f: '9发布闲置.png',    w: 463, h: 828,  n: '发布闲置' },
    { g: '用户端（小程序）', f: '10公告.png',       w: 445, h: 813,  n: '公告资讯' },
    { g: '用户端（小程序）', f: '11我的.png',       w: 460, h: 825,  n: '个人中心' },
    { g: '用户端（小程序）', f: '12海报.png',       w: 580, h: 1047, n: '分享海报' },
    { g: '用户端（小程序）', f: '二维码.png',       w: 322, h: 313,  n: '小程序码' },
    { g: '后台管理（PC）',   f: '80后台-首页.png',      w: 465, h: 828, n: '后台首页' },
    { g: '后台管理（PC）',   f: '81后台-兼职管理.png',  w: 460, h: 822, n: '兼职管理' },
    { g: '后台管理（PC）',   f: '82后台-失物管理.png',  w: 480, h: 831, n: '失物管理' },
    { g: '后台管理（PC）',   f: '83后台-闲置管理.png',  w: 459, h: 826, n: '闲置管理' },
    { g: '后台管理（PC）',   f: '84后台-表白墙管理.png', w: 469, h: 810, n: '表白墙管理' }
  ];

  const picker  = document.getElementById('picker');
  const shot    = document.getElementById('shot');
  const frame   = document.getElementById('frame');
  const wrap    = document.getElementById('wrap');
  const stage   = document.getElementById('stage');
  const spec    = document.getElementById('spec');
  const counter = document.getElementById('counter');

  // 构建分组下拉
  let html = '', lastG = '';
  PAGES.forEach((p, i) => {
    if (p.g !== lastG) {
      if (lastG) html += '</optgroup>';
      html += `<optgroup label="${p.g}">`;
      lastG = p.g;
    }
    html += `<option value="${i}">${p.n}</option>`;
  });
  html += '</optgroup>';
  picker.innerHTML = html;

  let cur = 0;
  let naturalH = 800;

  function fit() {
    const availW = stage.clientWidth - 40;
    const availH = stage.clientHeight - 42;
    const s = Math.min(1, availW / 400, availH / naturalH);
    frame.style.transform = `scale(${s})`;
    wrap.style.width  = (400 * s) + 'px';
    wrap.style.height = (naturalH * s) + 'px';
  }

  function show(i) {
    cur = (i + PAGES.length) % PAGES.length;
    const p = PAGES[cur];
    shot.src = BASE + p.f;
    naturalH = Math.round(400 * p.h / p.w);
    shot.style.height = naturalH + 'px';
    picker.value = String(cur);
    counter.textContent = `${cur + 1} / ${PAGES.length}`;
    spec.textContent = `展示 400 × ${naturalH}　原图 ${p.w}×${p.h}`;
    picker.blur();
    fit();
  }

  shot.addEventListener('load', () => fit());
  window.addEventListener('resize', fit);

  picker.addEventListener('change', e => show(Number(e.target.value)));
  document.getElementById('prev').addEventListener('click', () => show(cur - 1));
  document.getElementById('next').addEventListener('click', () => show(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  show(cur - 1);
    if (e.key === 'ArrowRight') show(cur + 1);
  });

  show(0);
</script>
</body>
</html>
