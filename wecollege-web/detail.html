<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>详情 · 校园生活圈</title>
<link rel="stylesheet" href="assets/wx-base.css">
<link rel="stylesheet" href="assets/page-board.css">
<link rel="stylesheet" href="assets/shell.css">
</head>
<body>
<div class="app">
  <header class="navbar">
    <a class="nb-back" href="javascript:history.back()">‹</a>
    <span class="nb-title" id="title">详情</span>
  </header>

  <div class="page" id="body"></div>
</div>

<script src="assets/data.js"></script>
<script>
  const type = qs('type') || 'board';
  const id = Number(qs('id')) || 1;

  const TITLES = { board: '表白详情', lost: '失物详情', job: '职位详情', leave: '闲置详情', news: '公告详情' };
  $('#title').textContent = TITLES[type] || '详情';

  function kv(k, v) {
    return `<div class="kv-row"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  }

  let html = '';

  if (type === 'board') {
    const p = DATA.board.find(x => x.id === id) || DATA.board[0];
    html = `
      <div style="background:#fff;padding:calc(0.133333cqw * 40) calc(0.133333cqw * 30)">
        <div style="font-size:calc(0.133333cqw * 32);color:#636DEA;font-weight:600">TO: ${p.to}</div>
        <div style="margin-top:calc(0.133333cqw * 24);font-size:calc(0.133333cqw * 30);line-height:1.8;color:#333">${p.desc}</div>
        ${p.from ? `<div style="margin-top:calc(0.133333cqw * 20);text-align:right;color:#888;font-size:calc(0.133333cqw * 26)">From: ${p.from}</div>` : ''}
        <div style="margin-top:calc(0.133333cqw * 10);text-align:right;color:#bbb;font-size:calc(0.133333cqw * 24)">${p.time}</div>
      </div>
      <div class="list" style="padding:calc(0.133333cqw * 25)">
        <div class="item shadow-project" style="background:#fff">
          <div class="bottom" style="border-top:0;padding:calc(0.133333cqw * 24)">
            <div class="info" style="color:#666">
              <div style="color:#666"><div class="icon-appreciate"></div>${p.likes}</div>
              <div style="color:#666"><div class="icon-comment"></div>${p.comments}</div>
              <div style="color:#666"><div class="icon-favor"></div>${p.favs}</div>
            </div>
          </div>
        </div>
      </div>`;
  } else if (type === 'lost') {
    const p = DATA.lost.find(x => x.id === id) || DATA.lost[0];
    html = kv('类型', p.cate === 1 ? '寻物启事' : '拾物招领')
         + kv('物品', p.title)
         + kv('状态', p.status === 1 ? '进行中' : '已结束')
         + kv('发布时间', p.time)
         + kv('浏览', p.views)
         + `<div class="tip-bar">请通过站内私信联系发布者，勿提前转账。</div>`;
  } else if (type === 'job') {
    const p = DATA.job.find(x => x.id === id) || DATA.job[0];
    html = kv('职位', p.title) + kv('工作地点', p.address) + kv('工资待遇', p.money)
         + kv('状态', p.status === 1 ? '招聘中' : '已结束') + kv('发布时间', p.time) + kv('浏览', p.views);
  } else if (type === 'leave') {
    const p = DATA.leave.find(x => x.id === id) || DATA.leave[0];
    html = kv('物品', p.title) + kv('分类', p.cate) + kv('价格', '¥' + p.price)
         + kv('状态', p.status === 1 ? '出售中' : '已售出') + kv('发布时间', p.time) + kv('浏览', p.views);
  } else {
    const p = DATA.news.find(x => x.id === id) || DATA.news[0];
    html = `<div class="detail-body" style="padding-bottom:calc(0.133333cqw * 10)">
        <div style="font-size:calc(0.133333cqw * 36);font-weight:600;line-height:1.5">${p.title}</div>
        <div style="margin-top:calc(0.133333cqw * 16);color:#999;font-size:calc(0.133333cqw * 24)">${p.time} · 阅读 ${p.views}</div>
      </div>
      <div class="detail-body">（演示正文）本通知由校园管理方发布，具体安排请以学校官方通知为准。如有疑问，可在「我的 — 联系我们」中反馈。</div>`;
  }

  $('#body').innerHTML = html;
</script>
</body>
</html>
