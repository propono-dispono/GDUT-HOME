# 校集 · Nginx 站点（只反代 API，静态后台后续再加 /admin/）
# 放置：/etc/nginx/conf.d/xj.conf
# 依赖证书：/etc/letsencrypt/live/xj.sxz-blog.xyz/
# 校验：nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name xj.sxz-blog.xyz;

    # certbot 续期与 HTTP 跳转都走这里
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xj.sxz-blog.xyz;

    ssl_certificate     /etc/letsencrypt/live/xj.sxz-blog.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xj.sxz-blog.xyz/privkey.pem;

    # 与 Spring multipart 5MB 匹配，留 3MB 余量
    client_max_body_size 8m;

    access_log /var/log/nginx/xj.access.log;
    error_log  /var/log/nginx/xj.error.log warn;

    # 生产关闭接口文档（本地 8080 仍可用）
    location = /api/doc.html { return 404; }
    location ^~ /api/v3/api-docs { return 404; }
    location ^~ /api/swagger-ui { return 404; }
    location ^~ /api/webjars { return 404; }

    location /api/ {
        proxy_pass         http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 管理后台静态站（构建产物放到 /opt/xiaojii/admin 后启用）
    location /admin/ {
        alias /opt/xiaojii/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }
}
